name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build (CGO-free)
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: Test (CGO-free)
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: Test (race detector)
        run: go test -race ./...
